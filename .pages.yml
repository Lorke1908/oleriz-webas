      required: true
    - name: cta
      label: Menu button
      type: string
      required: true
    - name: menu_label
      label: Mobile menu button label
      type: string
      required: true
      description: Not shown on screen — read aloud by screen readers.
  - name: hero
    label: Top of the homepage
    type: object
