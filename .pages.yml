# Config for Pages CMS (app.pagescms.org) — it defines the editing screens.
# Generated to keep the two languages identical; edit by hand only if you
# change the same thing in BOTH 'Website text' screens.
#
# Screens:
#   Job postings — Lithuanian   -> jobs.lt.json
#   Job postings — English      -> jobs.en.json
#   Website text — Lithuanian   -> content.lt.json
#   Website text — English      -> content.en.json
#   Site settings               -> site.json (shared by both languages)

content:
- name: jobs_lt
  label: Job postings — Lithuanian
  type: file
  path: jobs.lt.json
  format: json
  list: true
  fields:
  - name: title
    label: Job title
    type: string
    required: true
    description: The role as a candidate would recognise it.
  - name: team
    label: Company
    type: string
    required: true
    description: Small grey line under the title. Keep clients anonymous unless they agreed — e.g. "Gamybos
      įmonių grupė · 400 darbuotojų".
  - name: category
    label: Category
    type: select
    required: true
    default: Operacijos
    description: Decides which filter button this role appears under.
    options:
      values:
      - Finansai
      - Operacijos
      - Pardavimai
      - Personalas
      - IT
      - Rinkodara
      - Inžinerija
      - Logistika
      - Klientų aptarnavimas
      - Teisė
      - Vadovavimas
  - name: location
    label: Work location
    type: select
    required: true
    default: Vietoje
    options:
      values:
      - Vietoje
      - Hibridinis
      - Nuotolinis
  - name: type
    label: Contract type
    type: select
    required: true
    default: Visa darbo diena
    options:
      values:
      - Visa darbo diena
      - Ne visa darbo diena
      - Pagal sutartį
      - Terminuota
      - Praktika
  - name: salary
    label: Salary
    type: string
    required: true
    description: Shown exactly as typed. e.g. "3 200–3 800 € bruto/mėn." or "2 800–3 400 € + premijos".
  - name: experience
    label: Experience needed
    type: string
    description: Optional. e.g. "5+ metų patirtis".
  - name: level
    label: Seniority
    type: string
    description: Optional. e.g. "Vyresnysis specialistas", "Vidutinio lygio".
  - name: link
    label: Apply link
    type: string
    default: '#contact'
    description: 'Leave as #contact to send applicants to the contact form, or paste a full web address.'
- name: jobs_en
  label: Job postings — English
  type: file
  path: jobs.en.json
  format: json
  list: true
  fields:
  - name: title
    label: Job title
    type: string
    required: true
    description: The role as a candidate would recognise it.
  - name: team
    label: Company
    type: string
    required: true
    description: Small grey line under the title. Keep clients anonymous unless they agreed — e.g. "Manufacturing
      group · 400 employees".
  - name: category
    label: Category
    type: select
    required: true
    default: Operations
    description: Decides which filter button this role appears under.
    options:
      values:
      - Finance
      - Operations
      - Sales
      - HR
      - IT
      - Marketing
      - Engineering
      - Logistics
      - Customer Service
      - Legal
      - Management
  - name: location
    label: Work location
    type: select
    required: true
    default: On-site
    options:
      values:
      - On-site
      - Hybrid
      - Remote
  - name: type
    label: Contract type
    type: select
    required: true
    default: Full-time
    options:
      values:
      - Full-time
      - Part-time
      - Contract
      - Temporary
      - Internship
  - name: salary
    label: Salary
    type: string
    required: true
    description: Shown exactly as typed. e.g. "€3,200–3,800 gross/mo" or "€2,800–3,400 + bonus".
  - name: experience
    label: Experience needed
    type: string
    description: Optional. e.g. "5+ years".
  - name: level
    label: Seniority
    type: string
    description: Optional. e.g. "Senior", "Mid-level".
  - name: link
    label: Apply link
    type: string
    default: '#contact'
    description: 'Leave as #contact to send applicants to the contact form, or paste a full web address.'
- name: text_lt
  label: Website text — Lithuanian
  type: file
  path: content.lt.json
  format: json
  fields:
  - name: meta
    label: Browser tab & Google listing
    type: object
