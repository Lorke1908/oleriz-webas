- name: settings
  label: Site settings
  type: file
  path: site.json
  format: json
  fields:
  - name: url
    label: Site address
    type: string
    required: true
    description: Full address of the live site, ending in a slash. Only change this if you move to a different
      domain.
  - name: formspree_id
    label: Formspree form ID
    type: string
    description: Paste the code from your Formspree form address (the part after /f/). Until this is filled
      in, both sites show an Email us button instead of the contact form.
  - name: email
    label: Your email address
    type: string
    required: true
    description: Shown on both language versions and used for the Email us button.
  - name: phone
    label: Your phone number
    type: string
    required: true
    description: How it is displayed, spaces and all.
  - name: phone_link
    label: Phone number for dialling
    type: string
    required: true
    description: Same number with no spaces, starting +370, so tapping it on a phone dials correctly.
  - name: office
    label: Office address
    type: string
    description: Leave empty if you do not have one and the line is hidden from the contact section.
  - name: cv_upload
    label: Allow CV uploads
    type: boolean
    description: 'OFF unless your Formspree plan includes file uploads. The free plan does not: a CV attached
      to the form would be dropped without warning. While this is off, candidates are asked to email their
      CV instead.'
