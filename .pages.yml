      required: true
    - name: thanks_description
      label: Thank-you page description
      type: text
      required: true
  - name: brand
    label: Agency name
    type: object
    fields:
    - name: name_start
      label: Name — first part
      type: string
      required: true
      description: Shown in black in the logo. The lowercase is intentional.
    - name: name_end
      label: Name — second part
      type: string
      required: true
      description: Shown in blue straight after the first part. Currently a full stop, which is why the
        logo reads "oleriz" with a blue dot.
