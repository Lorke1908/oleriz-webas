      label: Homepage title
      type: string
      required: true
      description: Browser tab, and the blue headline in Google results.
    - name: description
      label: Homepage search description
      type: text
      required: true
      description: Grey summary under your link in Google. Aim for 150-160 characters.
    - name: roles_title
      label: Roles page title
      type: string
      required: true
    - name: roles_description
      label: Roles page search description
      type: text
      required: true
    - name: candidates_title
      label: Candidates page title
      type: string
      required: true
    - name: candidates_description
