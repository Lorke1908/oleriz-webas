      label: Text shown while the form is switched off
      type: text
      required: true
    - name: fallback_cta
      label: Button shown while the form is switched off
      type: string
      required: true
    - name: labels
      label: Form field labels
      type: object
      fields:
      - name: name
        label: Name field
        type: string
        required: true
      - name: email
        label: Email field
        type: string
        required: true
      - name: phone
        label: Phone label beside your number
        type: string
        required: true
        description: Used in the contact details on the left, not on the form.
      - name: office
        label: Office label
        type: string
        required: true
      - name: phone_field
        label: Phone field on the form
        type: string
        required: true
      - name: phone_optional
        label: Optional marker
        type: string
        required: true
        description: The small grey word after the phone label, e.g. "optional".
      - name: type
        label: Employer-or-candidate field
        type: string
        required: true
      - name: type_employer
        label: 'Option: employer'
        type: string
        required: true
      - name: type_candidate
        label: 'Option: candidate'
        type: string
        required: true
        description: Choosing this option is what reveals the CV block, so the two must match.
      - name: message
        label: Message field
        type: string
        required: true
      - name: message_placeholder
        label: Message example text
        type: text
        required: true
      - name: cv
        label: CV field label
        type: string
        required: true
      - name: cv_hint
        label: CV hint text
        type: text
        required: true
        description: Shown under the file picker when uploads are switched on.
      - name: cv_email_note
        label: CV text when uploads are off
        type: text
        required: true
        description: Shown to candidates instead of a file picker. Your email address is added to the
          end automatically.
  - name: footer
    label: Footer
    type: object
    fields:
    - name: copyright
      label: Copyright line
      type: string
      required: true
    - name: links
      label: Footer links
      type: object
