<meta charset="UTF-8">
<script>
  /* A reload otherwise returns you to wherever you were, and because
     scroll-behavior is smooth the page appears to scroll itself. Only skip
     restoration when no anchor was requested. */
  if ("scrollRestoration" in history && !location.hash) {
    history.scrollRestoration = "manual";
  }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
{{#page.noindex}}
<meta name="robots" content="noindex">
{{/page.noindex}}
<link rel="canonical" href="{{paths.url_self}}">
<link rel="alternate" hreflang="lt" href="{{paths.url_lt}}">
<link rel="alternate" hreflang="en" href="{{paths.url_en}}">
<link rel="alternate" hreflang="x-default" href="{{paths.url_lt}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{paths.styles}}">
